services:
  postgres:
    image: postgres:16
    container_name: rxsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rxsync
      POSTGRES_USER: rxsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - rxsync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rxsync -d rxsync"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rxsync-pgdata:
